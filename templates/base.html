<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CodeDaily{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        const savedTheme = localStorage.getItem("codedaily-theme") || "dark";
        document.documentElement.dataset.theme = savedTheme;
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- Interactive Background Particle Canvas -->
    <canvas id="particle-canvas" class="particle-canvas" aria-hidden="true"></canvas>

    <div class="page-loader" aria-hidden="true"></div>
    {% if current_user %}
    <div class="app-frame">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="{{ url_for('dashboard') }}">CodeDaily</a>
            <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" type="button">Menu</button>
            <div class="nav-links">
                <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
                <a href="{{ url_for('daily_question') }}" {% if request.endpoint in ['daily_question', 'practice_question'] %}aria-current="page"{% endif %}>Today's Question</a>
                <a href="{{ url_for('problems') }}" {% if request.endpoint == 'problems' %}aria-current="page"{% endif %}>Problems</a>
                <a href="{{ url_for('profile') }}" {% if request.endpoint == 'profile' %}aria-current="page"{% endif %}>Profile</a>
                <span class="nav-streak" title="Current daily streak">
                    <span>Streak</span> <strong class="js-streak-count">{{ current_stats.current_streak if current_stats else 0 }}</strong>
                </span>
                <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
                    <span class="theme-toggle-indicator" aria-hidden="true">
                        <!-- Sun Icon (Light Mode) -->
                        <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <!-- Moon Icon (Dark Mode) -->
                        <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </span>
                    <span class="theme-toggle-label js-theme-label">Dark</span>
                </button>
                <a class="logout-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </nav>
    {% endif %}
    <main class="page-shell{% if not current_user %} auth-shell{% endif %}">
        {% block content %}{% endblock %}
    </main>
    {% if current_user %}</div>{% endif %}

    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
