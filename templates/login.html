<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CodeDaily</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        const savedTheme = localStorage.getItem("codedaily-theme") || "dark";
        document.documentElement.dataset.theme = savedTheme;
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-body">
    <canvas id="particle-canvas" class="particle-canvas" aria-hidden="true"></canvas>

    <button type="button" class="theme-toggle-btn auth-theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <span class="theme-toggle-indicator" aria-hidden="true">
            <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </span>
        <span class="theme-toggle-label js-theme-label">Dark</span>
    </button>

    <section class="auth-card">
        <div class="auth-header">
            <span class="brand-mark">&lt;/&gt;</span>
            <h1>Welcome back</h1>
            <p>Log in to continue your daily coding streak.</p>
        </div>
        <form method="POST" class="auth-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="coder@example.com" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
            
            <button type="submit">Sign In</button>
        </form>
        <div class="auth-divider"><span>or continue with</span></div>
        <div class="oauth-options">
            <a class="oauth-button google-oauth-button" href="{{ url_for('google_login') }}">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.27 5.48-4.77 7.18l7.73 6C44.4 38.05 46.98 31.97 46.98 24.55z"/>
                    <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.14 1.45-4.89 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Sign in with Google</span>
            </a>
            {% if github_oauth_enabled %}
            <a class="oauth-button" href="{{ url_for('github_login') }}">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.08c-3.1.67-3.75-1.32-3.75-1.32-.5-1.28-1.23-1.62-1.23-1.62-1-.68.08-.67.08-.67 1.1.08 1.68 1.13 1.68 1.13.98 1.67 2.56 1.19 3.18.91.1-.71.38-1.19.69-1.47-2.47-.28-5.07-1.24-5.07-5.5 0-1.22.44-2.22 1.13-3-.11-.28-.49-1.42.11-2.96 0 0 .92-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.12-1.44 3.04-1.14 3.04-1.14.6 1.54.23 2.68.12 2.96.7.78 1.12 1.78 1.12 3.01 0 4.27-2.6 5.21-5.08 5.49.4.34.74 1 .74 2.01V22c0 .29.2.64.77.53A11.1 11.1 0 0 0 12 .9z"/>
                </svg>
                <span>Continue with GitHub</span>
            </a>
            {% endif %}
        </div>
        {% if message %}<p class="form-message">{{ message }}</p>{% endif %}
        <p class="auth-switch">New to CodeDaily? <a href="{{ url_for('register') }}">Create an account</a></p>
    </section>

    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
